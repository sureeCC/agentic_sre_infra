name: Test MI-POC Foundry access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: qa
    container:
      image: docker.io/suresh3796/vm-foundry-image@sha256:54ef7d949ad4dd58d99262060e16932c40c133416d04da14593ba7649c9aacbb
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
    env:
      AZURE_CONFIG_DIR: /tmp/mi-poc-test-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Sign in as MI-POC through QA federation
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: c9257135-e2a3-4f45-b099-0e5c423f4315
          tenant-id: 196eed21-c67a-4aae-a70b-9f97644d5d14
          subscription-id: c01d2634-a836-4a58-b540-98c9301beb24
      - name: Confirm identity and read Foundry agents
        run: |
          set -euo pipefail
          test "$(az account show --query user.name -o tsv)" = 'c9257135-e2a3-4f45-b099-0e5c423f4315'
          test "$(az account show --query id -o tsv)" = 'c01d2634-a836-4a58-b540-98c9301beb24'
          az rest --method get --url 'https://management.azure.com/subscriptions/c01d2634-a836-4a58-b540-98c9301beb24/resourceGroups/SureshSelvamC26413/providers/Microsoft.CognitiveServices/accounts/ai-sre-qa-c01d26-1021/projects/proj-agenticsre-qa?api-version=2025-06-01' --output none
          az rest --method get --url 'https://ai-sre-qa-c01d26-1021.services.ai.azure.com/api/projects/proj-agenticsre-qa/agents?api-version=v1' --resource https://ai.azure.com --output none
          {
            echo '## MI-POC Foundry access test passed'
            echo 'GitHub QA OIDC login, identity verification, project read and agent-list access succeeded.'
            echo 'No agent version was created or modified.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Clear authentication cache
        if: always()
        run: |
          set -euo pipefail
          test "$AZURE_CONFIG_DIR" = "/tmp/mi-poc-test-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$AZURE_CONFIG_DIR"
