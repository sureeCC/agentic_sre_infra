name: Terragrunt POC

on:
  push:
    branches: [main]
    paths: ['terragrunt/**', 'modules/**', 'scripts/ci/**', '.github/workflows/terraform.yml']
  pull_request:
    paths: ['terragrunt/**', 'modules/**', 'scripts/ci/**', '.github/workflows/terraform.yml']
  workflow_dispatch:
    inputs:
      run_plan:
        description: Plan all POC resources using the existing combined state
        type: boolean
        default: false
      allow_deletions:
        description: Allow reviewed deletes or replacements
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terragrunt-poc
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TG_TF_PATH: terraform

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Install checksum-verified Terragrunt 1.1.6
        run: bash scripts/ci/install-terragrunt.sh
      - name: Check Terragrunt formatting
        run: terragrunt hcl fmt --check --working-dir terragrunt
      - name: Validate POC and production combined stacks without Azure
        shell: pwsh
        run: |
          $env:TF_PLUGIN_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'terraform-provider-cache'
          New-Item -ItemType Directory -Path $env:TF_PLUGIN_CACHE_DIR -Force | Out-Null
          ./terragrunt/scripts/validate.ps1 -ValidateTerraform

  plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_plan
    needs: validate
    environment: terraform-plan-poc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      TG_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TG_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TG_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TG_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
      TG_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TG_STATE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TG_STATE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ALLOW_DELETIONS: ${{ inputs.allow_deletions }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Install checksum-verified Terragrunt 1.1.6
        run: bash scripts/ci/install-terragrunt.sh
      - name: Verify combined state and plan all POC resources
        run: bash scripts/ci/terragrunt-plan.sh
      - name: Encrypt saved plans
        env:
          TF_PLAN_KEY: ${{ secrets.TF_PLAN_KEY }}
        run: |
          test -n "$TF_PLAN_KEY"
          tar -czf plan.tar.gz -C plan-artifacts .
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:TF_PLAN_KEY -in plan.tar.gz -out plan.enc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terragrunt-plan-${{ github.run_id }}
          path: plan.enc
          retention-days: 1
          if-no-files-found: error
      - name: Remove plaintext plans
        if: always()
        run: rm -rf plan-artifacts plan.tar.gz

  # Apply remains disabled during infrastructure review. No deployment job is present.
