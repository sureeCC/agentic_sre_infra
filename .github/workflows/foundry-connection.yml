name: Configure Foundry connection

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with Azure OIDC configuration
        type: environment
        required: true
      project_resource_id:
        description: ARM resource ID of the Foundry project
        type: string
        required: true
      connection_name:
        description: Foundry connection name (creates or updates)
        type: string
        required: true
      key_count:
        description: Number of keys (1 to 3)
        type: number
        required: true
        default: 1
      key_names:
        description: Comma-separated Foundry key names
        type: string
        required: true
      secret_names:
        description: Comma-separated GitHub secret names in matching order
        type: string
        required: true

permissions: {}

jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
    steps:
      - name: Validate key and secret names
        id: keys
        env:
          KEY_COUNT: ${{ inputs.key_count }}
          KEY_NAMES: ${{ inputs.key_names }}
          SECRET_NAMES: ${{ inputs.secret_names }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          count = os.environ["KEY_COUNT"]
          keys = [value.strip() for value in os.environ["KEY_NAMES"].split(",")]
          secrets = [value.strip().upper() for value in os.environ["SECRET_NAMES"].split(",")]
          if count not in {"1", "2", "3"} or len(keys) != int(count) or len(secrets) != int(count):
              sys.exit("Enter 1 to 3 keys and the same number of key and secret names.")
          if len(set(keys)) != len(keys) or any(not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", key) for key in keys):
              sys.exit("Foundry key names must be valid identifiers and unique.")
          if any(not re.fullmatch(r"FOUNDRY_CONNECTION_[A-Z0-9_]+", secret) for secret in secrets):
              sys.exit("Each GitHub secret name must start with FOUNDRY_CONNECTION_.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for index, secret in enumerate(secrets, 1):
                  print(f"secret_{index}={secret}", file=output)
          PY

      - name: Sign in to Azure using OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.CLIENT_ID || vars.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID || vars.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION || vars.SUBSCRIPTION }}

      - name: Save and verify the Foundry connection
        env:
          PROJECT_ID: ${{ inputs.project_resource_id }}
          CONNECTION_NAME: ${{ inputs.connection_name }}
          KEY_NAMES: ${{ inputs.key_names }}
          CONNECTION_SECRET_1: ${{ steps.keys.outputs.secret_1 && secrets[steps.keys.outputs.secret_1] || '' }}
          CONNECTION_SECRET_2: ${{ steps.keys.outputs.secret_2 && secrets[steps.keys.outputs.secret_2] || '' }}
          CONNECTION_SECRET_3: ${{ steps.keys.outputs.secret_3 && secrets[steps.keys.outputs.secret_3] || '' }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          keys = [value.strip() for value in os.environ["KEY_NAMES"].split(",")]
          values = [os.environ.pop(f"CONNECTION_SECRET_{index}", "") for index in range(1, 4)]
          if any(not value for value in values[:len(keys)]):
              sys.exit("At least one selected GitHub Actions secret is missing or empty.")

          project_id = os.environ["PROJECT_ID"].strip()
          project = re.fullmatch(
              r"/subscriptions/([0-9a-f-]{36})/resourceGroups/[\w.()-]+"
              r"/providers/Microsoft\.CognitiveServices/accounts/[\w-]+/projects/[\w-]+",
              project_id, re.IGNORECASE | re.ASCII,
          )
          name = os.environ["CONNECTION_NAME"]
          if not project or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{0,63}", name):
              sys.exit("Provide a valid project ARM ID and connection name.")

          token = subprocess.run(
              ["az", "account", "get-access-token", "--subscription", project[1],
               "--resource", "https://management.azure.com/", "--query", "accessToken", "-o", "tsv"],
              capture_output=True, text=True, check=False,
          )
          if token.returncode or not token.stdout.strip():
              sys.exit("Could not acquire an ARM token for the target subscription.")

          url = f"https://management.azure.com{project_id}/connections/{name}?api-version=2025-06-01"
          headers = {"Authorization": f"Bearer {token.stdout.strip()}", "Content-Type": "application/json"}
          body = json.dumps({"properties": {
              "category": "CustomKeys", "authType": "CustomKeys",
              "credentials": {"keys": dict(zip(keys, values))}, "isSharedToAll": False,
          }}).encode()

          def request(method, data=None):
              try:
                  with urllib.request.urlopen(
                      urllib.request.Request(url, data=data, headers=headers, method=method),
                      timeout=60,
                  ) as response:
                      return json.load(response) if method == "GET" else None
              except urllib.error.HTTPError as error:
                  request_id = error.headers.get("x-ms-request-id", "unavailable")
                  sys.exit(f"Foundry connection {method} failed with HTTP {error.code} (request ID {request_id}).")
              except (urllib.error.URLError, TimeoutError, ValueError):
                  sys.exit(f"Foundry connection {method} failed before a usable response was received.")

          request("PUT", body)
          properties = request("GET").get("properties", {})
          if properties.get("category") != "CustomKeys" or properties.get("authType") != "CustomKeys":
              sys.exit("Foundry did not return the expected Custom Keys connection type.")
          print(f"Verified Foundry connection {name} (CustomKeys) with {len(keys)} secret-backed keys.")
          references = [(key, "$" + "{{connections." + name + ".credentials." + key + "}}")
                        for key in keys]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              print("## Foundry environment variables\n\n| Key | Value |\n|---|---|", file=summary)
              for key, reference in references:
                  print(f"| `{key}` | `{reference}` |", file=summary)
              print("\n```dotenv", file=summary)
              for key, reference in references:
                  print(f"{key}={reference}", file=summary)
              print("```", file=summary)
          PY
