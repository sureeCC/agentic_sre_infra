name: CD_Foundry_Container_Deploy_Reusable
run-name: CD_Foundry_Container_Deploy_Reusable

on:
  workflow_call:
    inputs:
      runner_name:
        description: GitHub runner label
        type: string
        required: false
        default: ubuntu-24.04
      image_name:
        description: Prebuilt CI tools image from Docker Hub or JFrog (prefer a digest reference)
        type: string
        required: true
      environment_name:
        description: GitHub environment providing vars and deployment protection
        type: string
        required: true
      agent_image:
        description: Previously pushed ACR image reference pinned by sha256 digest
        type: string
        required: true
      acr_login_server:
        description: ACR login server hosting the agent image
        type: string
        required: true
      image_tag:
        description: Original build tag for the deployment summary
        type: string
        required: false
        default: ''
      promote_endpoint:
        description: Explicitly route 100% endpoint traffic to the new version before checking it
        type: boolean
        required: false
        default: false
    secrets:
      CLIENT_ID:
        required: false
      TENANT_ID:
        required: false
      SUBSCRIPTION:
        required: false
      CI_REGISTRY_USERNAME:
        description: Optional pull username for a private CI tools registry
        required: false
      CI_REGISTRY_PASSWORD:
        description: Optional pull token for a private CI tools registry
        required: false

permissions:
  contents: read

concurrency:
  group: foundry-agent-${{ github.repository }}-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Foundry container
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner_name }}
    container:
      image: ${{ inputs.image_name }}
      credentials: ${{ fromJSON(secrets.CI_REGISTRY_USERNAME != '' && format('{{"username":{0},"password":{1}}}', toJSON(secrets.CI_REGISTRY_USERNAME), toJSON(secrets.CI_REGISTRY_PASSWORD)) || '{}') }}
    environment: ${{ inputs.environment_name }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      CI_TOOLS_IMAGE: ${{ inputs.image_name }}
      AZURE_CONFIG_DIR: /tmp/foundry-azure-${{ github.run_id }}-${{ github.run_attempt }}
      AGENT_IMAGE: ${{ inputs.agent_image }}
      ACR_LOGIN_SERVER: ${{ inputs.acr_login_server }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_AGENT_NAME: ${{ vars.FOUNDRY_AGENT_NAME }}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
      AGENT_CPU: ${{ vars.AGENT_CPU }}
      AGENT_MEMORY: ${{ vars.AGENT_MEMORY }}
    steps:
      # Checkout cleans the caller checkout; do not recursively delete the shared workspace.
      - name: Checkout application repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Validate configuration and tooling
        id: validate
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID || vars.CLIENT_ID }}
          TENANT_ID: ${{ secrets.TENANT_ID || vars.TENANT_ID }}
          SUBSCRIPTION: ${{ secrets.SUBSCRIPTION || vars.SUBSCRIPTION }}
        run: |
          set -euo pipefail
          for name in CLIENT_ID TENANT_ID SUBSCRIPTION AGENT_IMAGE ACR_LOGIN_SERVER FOUNDRY_PROJECT_ENDPOINT FOUNDRY_AGENT_NAME AZURE_AI_MODEL_DEPLOYMENT_NAME AGENT_CPU AGENT_MEMORY; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing configuration: $name"; exit 1; fi
          done
          test -f /.dockerenv
          echo "Running deployment tools inside the CI job container"
          python --version
          python -c 'import sys; assert sys.version_info[:2] == (3, 13), "Python 3.13 required"'
          az version --output none
          test -f scripts/ci/deploy-container-agent.py
          python -c 'import runpy; runpy.run_path("scripts/ci/deploy-container-agent.py")["definition"]()'

      - name: Azure login using managed identity federation
        id: login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.CLIENT_ID || vars.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID || vars.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION || vars.SUBSCRIPTION }}

      - name: Deploy image to Foundry and wait for active version
        id: deploy
        run: python scripts/ci/deploy-container-agent.py

      - name: Promote endpoint to deployed version
        id: route
        if: inputs.promote_endpoint
        env:
          DEPLOYED_AGENT_VERSION: ${{ steps.deploy.outputs.agent_version }}
        run: python scripts/ci/check-deployed-agent.py --promote

      - name: Verify deployed agent through Foundry endpoint
        id: post_check
        timeout-minutes: 8
        env:
          DEPLOYED_AGENT_VERSION: ${{ steps.deploy.outputs.agent_version }}
        run: python scripts/ci/check-deployed-agent.py

      - name: Write pipeline summary
        if: always()
        env:
          STAGE_RESULTS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment_name }}
          DEPLOYED_AGENT_VERSION: ${{ steps.deploy.outputs.agent_version }}
        run: |
          if command -v python >/dev/null && [ -f scripts/ci/write-agent-summary.py ]; then
            python scripts/ci/write-agent-summary.py
          else
            echo '## Foundry deployment summary' >> "$GITHUB_STEP_SUMMARY"
            echo "Job: $JOB_STATUS. Detailed summary unavailable because checkout or CI image initialization failed." >> "$GITHUB_STEP_SUMMARY"
          fi
