name: CD_Foundry_Container_Deploy_Reusable
run-name: CD_Foundry_Container_Deploy_Reusable

on:
  workflow_call:
    inputs:
      runner_name:
        description: GitHub runner label
        type: string
        required: false
        default: ubuntu-24.04
      image_name:
        description: Prebuilt CI tools image from Docker Hub or JFrog (prefer a digest reference)
        type: string
        required: true
      environment_name:
        description: GitHub environment providing vars and deployment protection
        type: string
        required: true
      agent_image:
        description: Previously pushed ACR image reference pinned by sha256 digest
        type: string
        required: true
      acr_login_server:
        description: ACR login server hosting the agent image
        type: string
        required: true
      image_tag:
        description: Original build tag for the deployment summary
        type: string
        required: false
        default: ''
      deployment_script_url:
        description: Versioned HTTPS JFrog URL for the standalone deployment script
        type: string
        required: true
      deployment_script_sha256:
        description: Trusted SHA256 of the deployment script
        type: string
        required: true
    secrets:
      JFROG_TOKEN:
        required: true
      JFROG_USERNAME:
        required: true
      CLIENT_ID:
        required: false
      TENANT_ID:
        required: false
      SUBSCRIPTION:
        required: false
      CI_REGISTRY_USERNAME:
        description: Optional pull username for a private CI tools registry
        required: false
      CI_REGISTRY_PASSWORD:
        description: Optional pull token for a private CI tools registry
        required: false

permissions:
  contents: read

concurrency:
  group: foundry-agent-${{ github.repository }}-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Foundry container
    runs-on: ${{ inputs.runner_name }}
    container:
      image: ${{ inputs.image_name }}
      credentials:
        username: ${{ secrets.JFROG_USERNAME }}
        password: ${{ secrets.JFROG_TOKEN }}
    environment: ${{ inputs.environment_name }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      CI_TOOLS_IMAGE: ${{ inputs.image_name }}
      DEPLOYMENT_SCRIPT: /tmp/foundry-script-${{ github.run_id }}-${{ github.run_attempt }}/foundry-agent.py
      AZURE_CONFIG_DIR: /tmp/foundry-azure-${{ github.run_id }}-${{ github.run_attempt }}
      AGENT_IMAGE: ${{ inputs.agent_image }}
      ACR_LOGIN_SERVER: ${{ inputs.acr_login_server }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_AGENT_NAME: ${{ vars.FOUNDRY_AGENT_NAME }}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
      AGENT_CPU: ${{ vars.AGENT_CPU }}
      AGENT_MEMORY: ${{ vars.AGENT_MEMORY }}
    steps:
      - name: Download and verify deployment script from JFrog
        env:
          SCRIPT_URL: ${{ inputs.deployment_script_url }}
          SCRIPT_SHA256: ${{ inputs.deployment_script_sha256 }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, pathlib, re, urllib.request
          from urllib.parse import urlparse
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          url = os.environ['SCRIPT_URL']
          parsed = urlparse(url)
          digest = os.environ['SCRIPT_SHA256'].lower()
          if (parsed.scheme != 'https' or parsed.hostname != 'trialgzg6hm.jfrog.io'
                  or parsed.port not in (None, 443) or parsed.username or parsed.password
                  or parsed.query or parsed.fragment
                  or not parsed.path.startswith('/artifactory/sre-poc-generic-local/')):
              raise SystemExit('Invalid JFrog script URL')
          if not re.fullmatch('[a-f0-9]{64}', digest):
              raise SystemExit('Invalid script SHA256')
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['JFROG_TOKEN']})
          try:
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=120) as response:
                  data = response.read(1024 * 1024 + 1)
          except Exception:
              raise SystemExit('JFrog download failed; check artifact URL and token read access') from None
          if len(data) > 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
              raise SystemExit('Deployment script checksum verification failed')
          path = pathlib.Path(os.environ['DEPLOYMENT_SCRIPT'])
          path.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
          path.write_bytes(data)
          print('Downloaded and verified pinned deployment script')
          PY

      - name: Validate configuration and tooling
        id: validate
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID || vars.CLIENT_ID }}
          TENANT_ID: ${{ secrets.TENANT_ID || vars.TENANT_ID }}
          SUBSCRIPTION: ${{ secrets.SUBSCRIPTION || vars.SUBSCRIPTION }}
        run: |
          set -euo pipefail
          for name in CLIENT_ID TENANT_ID SUBSCRIPTION AGENT_IMAGE ACR_LOGIN_SERVER FOUNDRY_PROJECT_ENDPOINT FOUNDRY_AGENT_NAME AZURE_AI_MODEL_DEPLOYMENT_NAME AGENT_CPU AGENT_MEMORY; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing configuration: $name"; exit 1; fi
          done
          test -f /.dockerenv
          echo "Running deployment tools inside the CI job container"
          python --version
          az version --output none
          python -c 'import os, runpy; deploy = runpy.run_path(os.environ["DEPLOYMENT_SCRIPT"]); deploy["target"](); deploy["definition"]()'

      - name: Azure login using managed identity federation
        id: login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.CLIENT_ID || vars.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID || vars.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION || vars.SUBSCRIPTION }}

      - name: Deploy image to Foundry and wait for active version
        id: deploy
        run: python "$DEPLOYMENT_SCRIPT" deploy

      - name: Verify deployed agent through Foundry endpoint
        id: post_check
        timeout-minutes: 15
        env:
          DEPLOYED_AGENT_VERSION: ${{ steps.deploy.outputs.agent_version }}
        run: python "$DEPLOYMENT_SCRIPT" verify

      - name: Clear deployment authentication cache
        id: cleanup
        if: always()
        run: |
          set -euo pipefail
          expected="/tmp/foundry-azure-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$AZURE_CONFIG_DIR" = "$expected"
          rm -rf -- "$AZURE_CONFIG_DIR"

      - name: Write pipeline summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment_name }}
          DEPLOYED_AGENT_VERSION: ${{ steps.deploy.outputs.agent_version }}
        run: |
          if command -v python >/dev/null && [ -f "$DEPLOYMENT_SCRIPT" ]; then
            python "$DEPLOYMENT_SCRIPT" summary
          else
            echo '## Foundry deployment summary' >> "$GITHUB_STEP_SUMMARY"
            echo "Job: $JOB_STATUS. Detailed summary unavailable because checkout or CI image initialization failed." >> "$GITHUB_STEP_SUMMARY"
          fi
