name: CD_Foundry_Container_Deploy_Reusable
run-name: CD_Foundry_Container_Deploy_Reusable

on:
  workflow_call:
    inputs:
      runner_name:
        description: GitHub runner label
        type: string
        required: false
        default: ubuntu-24.04
      environment_name:
        description: GitHub environment providing vars and deployment protection
        type: string
        required: true
      promote_endpoint:
        description: Explicitly route 100% endpoint traffic to the new version before checking it
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: foundry-agent-${{ github.repository }}-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build push and deploy Foundry container
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner_name }}
    environment: ${{ inputs.environment_name }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      AGENT_IMAGE_REPOSITORY: ${{ vars.AGENT_IMAGE_REPOSITORY || 'sre-alert-postgres-hosted' }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_AGENT_NAME: ${{ vars.FOUNDRY_AGENT_NAME }}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
      AGENT_CPU: ${{ vars.AGENT_CPU }}
      AGENT_MEMORY: ${{ vars.AGENT_MEMORY }}
    steps:
      # Checkout cleans the caller checkout; do not recursively delete the shared workspace.
      - name: Checkout application repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Validate configuration and tooling
        id: validate
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID || vars.CLIENT_ID }}
          TENANT_ID: ${{ secrets.TENANT_ID || vars.TENANT_ID }}
          SUBSCRIPTION: ${{ secrets.SUBSCRIPTION || vars.SUBSCRIPTION }}
        run: |
          set -euo pipefail
          for name in CLIENT_ID TENANT_ID SUBSCRIPTION ACR_NAME AGENT_IMAGE_REPOSITORY FOUNDRY_PROJECT_ENDPOINT FOUNDRY_AGENT_NAME AZURE_AI_MODEL_DEPLOYMENT_NAME AGENT_CPU AGENT_MEMORY; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing configuration: $name"; exit 1; fi
          done
          python --version
          python -c 'import sys; assert sys.version_info[:2] == (3, 13), "Python 3.13 required"'
          az version --output none
          docker version
          [[ "$ACR_NAME" =~ ^[a-z0-9]+$ ]]
          [[ "$AGENT_IMAGE_REPOSITORY" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]
          test -f applications/foundry-hosted-alert-agent/Dockerfile
          test -f scripts/ci/deploy-container-agent.py
          python scripts/ci/test-container-deployment.py
          python scripts/ci/test-post-deployment.py

      - name: Azure login using managed identity federation
        id: login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.CLIENT_ID || vars.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID || vars.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION || vars.SUBSCRIPTION }}

      - name: Resolve registry and authenticate Docker
        id: registry
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/foundry-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          registry=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          [[ "$registry" =~ ^[a-z0-9]+\.azurecr\.io$ ]]
          echo "ACR_LOGIN_SERVER=$registry" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$registry/$AGENT_IMAGE_REPOSITORY:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          az acr login --name "$ACR_NAME"

      - name: Build Linux Docker image
        id: build
        run: |
          set -euo pipefail
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE_TAG" applications/foundry-hosted-alert-agent
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE_TAG")" = agent
          docker run --rm --entrypoint python "$IMAGE_TAG" -c 'import main'

      - name: Push image and record immutable reference
        id: push
        run: |
          set -euo pipefail
          docker push "$IMAGE_TAG"
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_TAG")
          [[ "$image" == "$ACR_LOGIN_SERVER/$AGENT_IMAGE_REPOSITORY@sha256:"* ]]
          echo "AGENT_IMAGE=$image" >> "$GITHUB_ENV"
          echo "Pushed image: $image"

      - name: Deploy image to Foundry and wait for active version
        id: deploy
        run: python scripts/ci/deploy-container-agent.py

      - name: Promote endpoint to deployed version
        id: route
        if: inputs.promote_endpoint
        env:
          DEPLOYED_AGENT_VERSION: ${{ steps.deploy.outputs.agent_version }}
        run: python scripts/ci/check-deployed-agent.py --promote

      - name: Verify deployed agent through Foundry endpoint
        id: post_check
        timeout-minutes: 8
        env:
          DEPLOYED_AGENT_VERSION: ${{ steps.deploy.outputs.agent_version }}
        run: python scripts/ci/check-deployed-agent.py

      - name: Clear registry login
        id: registry_logout
        if: always()
        run: |
          if [ -n "${ACR_LOGIN_SERVER:-}" ]; then docker logout "$ACR_LOGIN_SERVER"; fi

      - name: Write pipeline summary
        if: always()
        env:
          STAGE_RESULTS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment_name }}
          DEPLOYED_AGENT_VERSION: ${{ steps.deploy.outputs.agent_version }}
        run: |
          if command -v python >/dev/null && [ -f scripts/ci/write-agent-summary.py ]; then
            python scripts/ci/write-agent-summary.py
          else
            echo '## Foundry deployment summary' >> "$GITHUB_STEP_SUMMARY"
            echo "Job: $JOB_STATUS. Detailed summary unavailable because checkout or Python setup failed." >> "$GITHUB_STEP_SUMMARY"
          fi
