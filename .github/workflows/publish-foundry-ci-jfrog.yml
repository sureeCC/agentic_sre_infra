name: Build and publish Foundry deployment runtime to JFrog
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-foundry-ci-jfrog
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: qa
    # Existing build-capable runtime bootstraps the deployment-only image.
    container:
      image: trialgzg6hm.jfrog.io/sre-poc-docker-local/vm-foundry-image@sha256:bb7ea32a7343dda37dac7cc3e200ae044edb0e65b4931d51ccf060ce40c951b7
      credentials:
        username: ${{ secrets.JFROG_USERNAME }}
        password: ${{ secrets.JFROG_TOKEN }}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    defaults:
      run:
        shell: bash
    env:
      REGISTRY: trialgzg6hm.jfrog.io
      DESTINATION_REPOSITORY: trialgzg6hm.jfrog.io/sre-poc-docker-local/foundry-deploy
      DOCKER_CONFIG: /tmp/jfrog-docker-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout runtime source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build deployment-only runtime
        run: |
          set -euo pipefail
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "foundry-deploy:$GITHUB_SHA" ci/foundry-tools
      - name: Validate runtime and deployment script
        run: |
          set -euo pipefail
          docker run --rm "foundry-deploy:$GITHUB_SHA" bash -euc '
            python --version
            az version --output none
            az account get-access-token --help >/dev/null
            node --version
            git --version
            python -c "import importlib.util, shutil; assert importlib.util.find_spec(\"pip\") is None; assert importlib.util.find_spec(\"ensurepip\") is None; assert shutil.which(\"docker\") is None"
          '
          check_container="foundry-runtime-check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker rm -f "$check_container" >/dev/null 2>&1 || true' EXIT
          docker create --name "$check_container" "foundry-deploy:$GITHUB_SHA" python /tests/test-foundry-agent.py
          docker cp scripts/ci/. "$check_container:/tests"
          docker start --attach "$check_container"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$check_container")" = 0
      - name: Authenticate to JFrog
        env:
          JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$JFROG_USERNAME"
          test -n "$JFROG_TOKEN"
          printf '%s' "$JFROG_TOKEN" | docker login "$REGISTRY" --username "$JFROG_USERNAME" --password-stdin
      - name: Publish and verify runtime image
        id: push
        run: |
          set -euo pipefail
          target="$DESTINATION_REPOSITORY:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          source_id=$(docker image inspect --format '{{.Id}}' "foundry-deploy:$GITHUB_SHA")
          docker tag "foundry-deploy:$GITHUB_SHA" "$target"
          docker push "$target"
          image=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$target" | grep -F "$DESTINATION_REPOSITORY@sha256:")
          test -n "$image"
          docker pull --platform linux/amd64 "$image"
          test "$(docker image inspect --format '{{.Id}}' "$image")" = "$source_id"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf '## Deployment runtime published\n\nImage: `%s`\n\nSet `FOUNDRY_DEPLOY_IMAGE` to this digest reference.\n' "$image" >> "$GITHUB_STEP_SUMMARY"
      - name: Clear registry credentials
        if: always()
        run: |
          set -euo pipefail
          docker logout "$REGISTRY" || true
          test "$DOCKER_CONFIG" = "/tmp/jfrog-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$DOCKER_CONFIG"