name: Publish existing Foundry CI image to JFrog
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-foundry-ci-jfrog
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: docker:28-cli
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    defaults:
      run:
        shell: sh
    env:
      SOURCE_REPOSITORY: docker.io/suresh3796/vm-foundry-image
      SOURCE_DIGEST: sha256:54ef7d949ad4dd58d99262060e16932c40c133416d04da14593ba7649c9aacbb
      IMAGE_TAG: fcee67c4a42dee5ed55f61233824a1c54725aa05-38870653394-1
      REGISTRY: trialgzg6hm.jfrog.io
      DESTINATION_REPOSITORY: trialgzg6hm.jfrog.io/sre-poc-docker-local/vm-foundry-image
      DOCKER_CONFIG: /tmp/jfrog-docker-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Authenticate to JFrog
        env:
          JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: |
          set -eu
          test -n "$JFROG_USERNAME"
          test -n "$JFROG_TOKEN"
          printf '%s' "$JFROG_TOKEN" | docker login "$REGISTRY" --username "$JFROG_USERNAME" --password-stdin

      - name: Pull existing image by immutable digest
        run: |
          set -eu
          docker pull --platform linux/amd64 "$SOURCE_REPOSITORY@$SOURCE_DIGEST"
          docker run --rm "$SOURCE_REPOSITORY@$SOURCE_DIGEST" bash -euo pipefail -c '
            python --version
            python -m pip check
            az version --output none
            docker --version
            node --version
            git --version
            jq --version
          '

      - name: Push and verify identical image contents
        id: push
        run: |
          set -eu
          target="$DESTINATION_REPOSITORY:$IMAGE_TAG"
          source_id=$(docker image inspect --format '{{.Id}}' "$SOURCE_REPOSITORY@$SOURCE_DIGEST")
          docker tag "$SOURCE_REPOSITORY@$SOURCE_DIGEST" "$target"
          docker push "$target"
          docker pull --platform linux/amd64 "$target"
          image=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$target" | grep -F "$DESTINATION_REPOSITORY@sha256:")
          test -n "$image"
          docker pull --platform linux/amd64 "$image"
          destination_id=$(docker image inspect --format '{{.Id}}' "$image")
          test "$destination_id" = "$source_id"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo '## Foundry CI tools image published to JFrog'
            echo ''
            echo "Image: $image"
            echo ''
            echo 'The published image was pulled by its destination digest and its configuration and layer content identity matches the source.'
            echo 'JFrog pull credentials are required before using this image as a job container.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clear registry credentials
        if: always()
        run: |
          set -eu
          docker logout "$REGISTRY" || true
          test "$DOCKER_CONFIG" = "/tmp/jfrog-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$DOCKER_CONFIG"
