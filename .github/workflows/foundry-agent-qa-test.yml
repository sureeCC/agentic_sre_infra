name: QA Foundry Docker deployment test
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: foundry-qa-build-and-deploy
  cancel-in-progress: false
jobs:
  publish-script:
    name: Publish verified deployment script to JFrog
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: qa
    container:
      image: ${{ vars.FOUNDRY_DEPLOY_IMAGE || 'trialgzg6hm.jfrog.io/sre-poc-docker-local/vm-foundry-image@sha256:bb7ea32a7343dda37dac7cc3e200ae044edb0e65b4931d51ccf060ce40c951b7' }}
      credentials:
        username: ${{ secrets.JFROG_USERNAME }}
        password: ${{ secrets.JFROG_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run offline regression tests
        run: python scripts/ci/test-foundry-agent.py
      - name: Publish checksum-addressed script release
        env:
          ARTIFACTORY_USER: ${{ secrets.JFROG_USERNAME }}
          ARTIFACTORY_TOKEN: ${{ secrets.JFROG_TOKEN }}
          EXPECTED_SHA256: 2ff74201659f9d3b5fb743f914eec13ccac64b10d52e1fe17dd56d88a0bfa769
        run: |
          python - <<'PY'
          import base64, hashlib, os, pathlib, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          data = pathlib.Path('scripts/ci/foundry-agent.py').read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          if digest != os.environ['EXPECTED_SHA256']:
              raise SystemExit('Script differs from caller checksum; update release pins')
          url = f'https://trialgzg6hm.jfrog.io/artifactory/sre-poc-generic-local/foundry-agent/{digest}/foundry-agent.py'
          user, token = os.environ['ARTIFACTORY_USER'], os.environ['ARTIFACTORY_TOKEN']
          if not user or not token:
              raise SystemExit('Missing JFrog publishing credentials')
          auth = base64.b64encode(f'{user}:{token}'.encode()).decode()
          request = urllib.request.Request(url, data=data, method='PUT', headers={
              'Authorization': 'Basic ' + auth, 'Content-Type': 'application/octet-stream',
              'X-Checksum-Sha256': digest})
          try:
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=120) as response:
                  if response.status not in (200, 201):
                      raise RuntimeError('Unexpected upload status')
          except Exception:
              raise SystemExit('JFrog script publication failed; check token write access') from None
          print(f'Published deployment script SHA256: {digest}')
          PY
  build:
    name: Build and push agent image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: qa
    timeout-minutes: 30
    container:
      # Separate build runtime: Docker/Buildx are intentionally absent from the
      # deployment-only image selected by FOUNDRY_DEPLOY_IMAGE.
      image: trialgzg6hm.jfrog.io/sre-poc-docker-local/vm-foundry-image@sha256:bb7ea32a7343dda37dac7cc3e200ae044edb0e65b4931d51ccf060ce40c951b7
      credentials:
        username: ${{ secrets.JFROG_USERNAME }}
        password: ${{ secrets.JFROG_TOKEN }}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    defaults:
      run:
        shell: bash
    outputs:
      agent_image: ${{ steps.push.outputs.agent_image }}
      acr_login_server: ${{ steps.push.outputs.acr_login_server }}
      image_tag: ${{ steps.push.outputs.image_tag }}
    env:
      AZURE_CONFIG_DIR: /tmp/foundry-build-azure-${{ github.run_id }}-${{ github.run_attempt }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      AGENT_IMAGE_REPOSITORY: ${{ vars.AGENT_IMAGE_REPOSITORY || 'sre-alert-postgres-hosted' }}
    steps:
      - name: Checkout application
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test deployment helpers
        run: |
          set -euo pipefail
          python scripts/ci/test-foundry-agent.py
      - name: Azure login using managed identity federation
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.CLIENT_ID || vars.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID || vars.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION || vars.SUBSCRIPTION }}
      - name: Resolve registry and authenticate Docker
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/foundry-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          registry=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          [[ "$registry" =~ ^[a-z0-9]+\.azurecr\.io$ ]]
          echo "ACR_LOGIN_SERVER=$registry" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$registry/$AGENT_IMAGE_REPOSITORY:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          az acr login --name "$ACR_NAME"

      - name: Build Linux Docker image
        id: build
        run: |
          set -euo pipefail
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE_TAG" applications/foundry-hosted-alert-agent
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE_TAG")" = agent
          docker run --rm --entrypoint python "$IMAGE_TAG" -c 'import main'

      - name: Push image and record immutable reference
        id: push
        run: |
          set -euo pipefail
          docker push "$IMAGE_TAG"
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_TAG")
          [[ "$image" == "$ACR_LOGIN_SERVER/$AGENT_IMAGE_REPOSITORY@sha256:"* ]]
          echo "AGENT_IMAGE=$image" >> "$GITHUB_ENV"
          echo "agent_image=$image" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Pushed image: $image"

      - name: Clear registry login
        if: always()
        run: |
          if [ -n "${ACR_LOGIN_SERVER:-}" ]; then docker logout "$ACR_LOGIN_SERVER"; fi
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, publish-script]
    uses: ./.github/workflows/foundry-agent-container-reusable.yml
    with:
      runner_name: ubuntu-24.04
      artifactory_user: ${{ vars.ARTIFACTORY_USER }}
      artifactory_url: https://trialgzg6hm.jfrog.io
      container_options: ${{ vars.CONTAINER_OPTIONS }}
      image_name: ${{ vars.FOUNDRY_DEPLOY_IMAGE || 'trialgzg6hm.jfrog.io/sre-poc-docker-local/vm-foundry-image@sha256:bb7ea32a7343dda37dac7cc3e200ae044edb0e65b4931d51ccf060ce40c951b7' }}
      environment_name: qa
      agent_image: ${{ needs.build.outputs.agent_image }}
      acr_login_server: ${{ needs.build.outputs.acr_login_server }}
      image_tag: ${{ needs.build.outputs.image_tag }}
      deployment_script_url: https://trialgzg6hm.jfrog.io/artifactory/sre-poc-generic-local/foundry-agent/2ff74201659f9d3b5fb743f914eec13ccac64b10d52e1fe17dd56d88a0bfa769/foundry-agent.py
      deployment_script_sha256: 2ff74201659f9d3b5fb743f914eec13ccac64b10d52e1fe17dd56d88a0bfa769
    secrets:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
      SUBSCRIPTION: ${{ secrets.SUBSCRIPTION }}
      artifactory_token: ${{ secrets.JFROG_TOKEN }}
