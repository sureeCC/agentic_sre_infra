name: CD_Foundry_Agent_Deploy_Reusable
run-name: CD_Foundry_Agent_Deploy_Reusable

on:
  workflow_call:
    inputs:
      runner_name:
        description: GitHub runner label
        type: string
        required: false
        default: ubuntu-24.04
      image_name:
        description: Optional approved container image; empty uses the hosted runner directly
        type: string
        required: false
        default: ''
      environment_name:
        description: GitHub environment providing vars and deployment protection
        type: string
        required: true
      branch:
        description: Deployment classification; prod triggers the approval gate (does not select the checkout ref)
        type: string
        required: false
        default: ''
      approval_environment:
        description: Environment with required reviewers for production deployments
        type: string
        required: false
        default: prod-approval

permissions:
  contents: read

concurrency:
  group: foundry-agent-${{ github.repository }}-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  approval:
    name: Approval
    if: inputs.branch == 'prod' || inputs.environment_name == 'prod'
    runs-on: ${{ inputs.runner_name }}
    environment: ${{ inputs.approval_environment }}
    steps:
      - name: Record approval
        shell: bash
        run: echo 'Production deployment approval completed.'

  deploy:
    name: Deploy Foundry hosted agent
    needs: [approval]
    if: ${{ !cancelled() && (needs.approval.result == 'success' || needs.approval.result == 'skipped') }}
    runs-on: ${{ inputs.runner_name }}
    environment: ${{ inputs.environment_name }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    container: ${{ inputs.image_name != '' && fromJSON(format('{{"image":{0},"options":{1}}}', toJSON(inputs.image_name), toJSON(vars.CONTAINER_OPTIONS))) || null }}
    defaults:
      run:
        shell: bash
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_AGENT_NAME: ${{ vars.FOUNDRY_AGENT_NAME }}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_DATABASE: ${{ vars.POSTGRES_DATABASE }}
      POSTGRES_AAD_USER: ${{ vars.POSTGRES_AAD_USER }}
      AGENT_CPU: ${{ vars.AGENT_CPU }}
      AGENT_MEMORY: ${{ vars.AGENT_MEMORY }}
    steps:
      # Checkout cleans the caller checkout; do not recursively delete the shared workspace.
      - name: Checkout application repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python for GitHub-hosted runner
        if: inputs.image_name == ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Validate configuration and tooling
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID || vars.CLIENT_ID }}
          TENANT_ID: ${{ secrets.TENANT_ID || vars.TENANT_ID }}
          SUBSCRIPTION: ${{ secrets.SUBSCRIPTION || vars.SUBSCRIPTION }}
        run: |
          set -euo pipefail
          for name in CLIENT_ID TENANT_ID SUBSCRIPTION FOUNDRY_PROJECT_ENDPOINT FOUNDRY_AGENT_NAME AZURE_AI_MODEL_DEPLOYMENT_NAME POSTGRES_HOST POSTGRES_DATABASE POSTGRES_AAD_USER AGENT_CPU AGENT_MEMORY; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing configuration: $name"; exit 1; fi
          done
          python --version
          python -c 'import sys; assert sys.version_info[:2] == (3, 13), "Python 3.13 required"'
          az version --output none
          test -f scripts/ci/package-agent.py
          test -f scripts/ci/deploy-agent.py
          test -f applications/foundry-hosted-alert-agent/metadata.json

      - name: Validate dependencies and package source
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/foundry-agent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source "${RUNNER_TEMP}/foundry-agent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/bin/activate"
          python -m pip install -r applications/foundry-hosted-alert-agent/requirements.txt
          python -m pip check
          python -c 'from agent_framework import Agent, tool; from agent_framework.foundry import FoundryChatClient; from agent_framework_foundry_hosting import ResponsesHostServer; from azure.ai.agentserver.core import AgentConfig, get_request_context; import psycopg'
          python scripts/ci/package-agent.py

      - name: Azure login using managed identity federation
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.CLIENT_ID || vars.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID || vars.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION || vars.SUBSCRIPTION }}

      - name: Inspect previously uploaded source package
        run: |
          python - <<'PY'
          import hashlib, io, json, os, subprocess, urllib.request, urllib.error, zipfile
          token = subprocess.check_output(["az", "account", "get-access-token", "--resource", "https://ai.azure.com", "--query", "accessToken", "-o", "tsv"], text=True).strip()
          endpoint = os.environ["FOUNDRY_PROJECT_ENDPOINT"].rstrip("/")
          name = os.environ["FOUNDRY_AGENT_NAME"]
          req = urllib.request.Request(f"{endpoint}/agents/{name}/code:download?api-version=v1", headers={"Authorization": f"Bearer {token}", "Accept": "application/zip"})
          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  code = response.read()
              with zipfile.ZipFile(io.BytesIO(code)) as archive:
                  print("Stored source SHA256:", hashlib.sha256(code).hexdigest())
                  print("Stored source entries:", [(i.filename, oct(i.external_attr >> 16), i.file_size) for i in archive.infolist()])
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              print("No previous source package exists")
          PY

      - name: Deploy and wait for active version
        run: python scripts/ci/deploy-agent.py

      - name: clean_working_dir
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('dist/agent.zip').unlink(missing_ok=True)
          PY
