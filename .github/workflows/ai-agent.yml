name: Deploy Foundry AI agent

on:
  pull_request:
    paths: ['applications/foundry-hosted-alert-agent/**', 'scripts/ci/*agent.py', '.github/workflows/ai-agent.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundry-agent-poc
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate runtime dependencies
        run: |
          python -m pip install -r applications/foundry-hosted-alert-agent/requirements.txt
          python -m pip check
          python -c 'from agent_framework import Agent, tool; from agent_framework.foundry import FoundryChatClient; from agent_framework_foundry_hosting import ResponsesHostServer; from azure.ai.agentserver.core import AgentConfig, get_request_context; import psycopg'
      - name: Package source
        run: python scripts/ci/package-agent.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          name: agent-${{ github.sha }}
          path: dist/agent.zip
          retention-days: 7
          if-no-files-found: error

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: agent-poc
    permissions:
      contents: read
      id-token: write
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_AGENT_NAME: ${{ vars.FOUNDRY_AGENT_NAME }}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_DATABASE: ${{ vars.POSTGRES_DATABASE }}
      POSTGRES_AAD_USER: ${{ vars.POSTGRES_AAD_USER }}
      AGENT_CPU: ${{ vars.AGENT_CPU }}
      AGENT_MEMORY: ${{ vars.AGENT_MEMORY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-${{ github.sha }}
          path: dist
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy and wait for active version
        run: python scripts/ci/deploy-agent.py
