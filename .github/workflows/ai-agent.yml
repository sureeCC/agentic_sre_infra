name: Validate Foundry Docker agent

on:
  pull_request:
    paths:
      - 'applications/foundry-hosted-alert-agent/**'
      - 'scripts/ci/*agent*.py'
      - 'scripts/ci/test-*deployment.py'
      - '.github/workflows/ai-agent.yml'
      - '.github/workflows/foundry-agent-container-reusable.yml'
      - '.github/workflows/foundry-agent-qa-test.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    container:
      image: ${{ vars.CI_RUNNER_IMAGE }}
      credentials: ${{ fromJSON(secrets.CI_REGISTRY_USERNAME != '' && format('{{"username":{0},"password":{1}}}', toJSON(secrets.CI_REGISTRY_USERNAME), toJSON(secrets.CI_REGISTRY_PASSWORD)) || '{}') }}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test deployment and endpoint verification
        run: |
          python scripts/ci/test-container-deployment.py
          python scripts/ci/test-post-deployment.py
      - name: Build and validate agent imports
        run: |
          docker build --platform linux/amd64 --tag foundry-agent:ci applications/foundry-hosted-alert-agent
          test "$(docker image inspect --format '{{.Config.User}}' foundry-agent:ci)" = agent
          docker run --rm --entrypoint python foundry-agent:ci -c 'import main'
