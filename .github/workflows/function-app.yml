name: Deploy Function App

on:
  pull_request:
    paths: ['applications/function-alert-bridge/**', '.github/workflows/function-app.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: function-app-poc
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Build release package
        run: dotnet publish applications/function-alert-bridge/agent-bridge-function.csproj --configuration Release --output publish
      - name: Verify Functions package
        run: test -f publish/host.json && test -f publish/functions.metadata && test -f publish/worker.config.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          name: function-${{ github.sha }}
          path: publish/
          retention-days: 7
          if-no-files-found: error

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: function-poc
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: function-${{ github.sha }}
          path: publish
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify target and ingress authentication
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.FUNCTION_APP_NAME }}
        run: |
          test -n "$RESOURCE_GROUP" && test -n "$APP_NAME"
          az functionapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query state -o tsv
          az webapp auth show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" -o json > auth.json
          jq -e '.platform.enabled == true and .globalValidation.requireAuthentication == true and .identityProviders.azureActiveDirectory.enabled == true' auth.json > /dev/null
      - name: Deploy built package
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1
        with:
          app-name: ${{ vars.FUNCTION_APP_NAME }}
          package: publish
      - name: Verify deployed trigger registration
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.FUNCTION_APP_NAME }}
        run: |
          for attempt in {1..12}; do
            az functionapp function list --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" -o json > functions.json
            if jq -e 'map(.name | split("/")[-1]) | index("ReceiveKibanaAlert") != null and index("ProcessEventHubAlert") != null' functions.json > /dev/null; then exit 0; fi
            sleep 10
          done
          echo 'Expected functions were not registered.' >&2
          exit 1
